project_id = "kotoba-personal"
[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
major_version = 15
[auth]
enabled = true
site_url = "env(SITE_ORIGIN)"
additional_redirect_urls = []
enable_signup = false
[auth.email]
enable_signup = false
enable_confirmations = true
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
skip_nonce_check = false
[functions.ai-tutor]
verify_jwt = false
[functions.backup]
verify_jwt = false
